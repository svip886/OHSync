name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ohsync-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 正式发行版的签名密钥来自仓库 Secrets；**没配置时退回 debug 签名**（见
      # app/build.gradle.kts 的 release 块），这样 fork 的 CI 也能产出一个能直接装的
      # release 包，而不是一个装不上的未签名包。
      # 构建不再限定 tag：手动触发/推分支也会出 release 包并上传为 artifact，
      # 只有「发布到 Releases」这一步仍然只在打 tag 时执行。
      - name: Build release APK
        env:
          OHSYNC_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          OHSYNC_KEYSTORE_PASSWORD: ${{ secrets.OHSYNC_KEYSTORE_PASSWORD }}
          OHSYNC_KEY_ALIAS: ${{ secrets.OHSYNC_KEY_ALIAS }}
          OHSYNC_KEY_PASSWORD: ${{ secrets.OHSYNC_KEY_PASSWORD }}
        run: |
          if [ -n "$OHSYNC_KEYSTORE_PASSWORD" ]; then
            echo "${{ secrets.OHSYNC_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "未配置正式密钥，release 将使用 debug 签名"
          fi
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ohsync-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          name: OHSync ${{ github.ref_name }}
